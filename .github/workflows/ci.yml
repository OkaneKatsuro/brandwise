name: CI
on:
  push: { branches: [main, dev] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install dependencies
        run: (cd packages/core && npm install) && (cd apps/bb-plugin-brandwise && npm install)
      - name: Checks (English Markdown, core tests without a database, plugin type check)
        run: tools/check.sh
